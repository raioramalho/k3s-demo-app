apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app-b
  namespace: app-b
  labels:
    app: nginx-app-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-app-b
  template:
    metadata:
      labels:
        app: nginx-app-b
    spec:
      containers:
        - name: nginx
          image: southamerica-east1-docker.pkg.dev/fleet-orchestrator/forch-images/nginx-app-b:v1
          ports:
            - containerPort: 80
